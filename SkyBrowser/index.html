<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="browser-container">
    <!-- Header Titlebar -->
    <header class="titlebar">
      <div class="titlebar-left">
        <div class="titlebar-logo">
          <svg viewBox="0 0 24 24" width="16" height="16" class="sky-logo-icon">
            <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
          <span class="logo-text">Sky</span>
          <span class="version-tag">v1.0</span>
        </div>
      </div>

      <div class="titlebar-right window-controls">
        <button id="btn-minimize" class="control-btn" title="Minimize">
          <svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M19 13H5v-2h14v2z"/></svg>
        </button>
        <button id="btn-maximize" class="control-btn" title="Maximize">
          <svg viewBox="0 0 24 24" width="11" height="11"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
        </button>
        <button id="btn-close" class="control-btn close-btn" title="Close">
          <svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </header>

    <!-- Toolbar -->
    <nav class="toolbar">
      <div class="nav-controls">
        <button id="btn-back" class="tool-btn" title="Back">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <button id="btn-forward" class="tool-btn" title="Forward">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/></svg>
        </button>
        <button id="btn-reload" class="tool-btn" title="Reload Page">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button id="btn-home" class="tool-btn" title="Home Page">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>
      </div>

      <!-- Smart Omnibox -->
      <div class="omnibox-container">
        <div id="ssl-badge" class="ssl-indicator" title="Connection is secure">
          <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
        <input type="text" id="address-bar" placeholder="Search or type a Web URL (e.g., github.com)" value="https://www.google.com">
      </div>

      <!-- Search Engine Selector -->
      <div class="engine-selector">
        <select id="engine-picker" title="Default Search Engine">
          <option value="google" selected>🔍 Google</option>
          <option value="yandex">🔴 Yandex</option>
          <option value="duckduckgo">🦆 DuckDuckGo</option>
          <option value="bing">🟦 Bing</option>
          <option value="ecosia">🌱 Ecosia</option>
        </select>
      </div>
    </nav>

    <!-- Progress Bar -->
    <div id="progress-bar" class="progress-bar"></div>

    <!-- Webview Viewport -->
    <main class="webview-viewport">
      <webview 
        id="sky-webview" 
        src="https://www.google.com" 
        partition="persist:sky"
        allowpopups="true"
      ></webview>
    </main>

    <!-- Statusbar -->
    <footer class="statusbar">
      <span id="status-message">Sky Browser Ready</span>
      <span id="page-title">Google</span>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
