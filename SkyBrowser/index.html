<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #0b0c10;
      --bg-header: #12141c;
      --bg-toolbar: #181a26;
      --bg-omnibox: #222636;
      --bg-tab-inactive: #161824;
      --bg-tab-active: #222638;
      --bg-hover: #2d3348;
      --accent-sky: #38bdf8;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(56, 189, 248, 0.4);
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: var(--bg-app); color: var(--text-main); font-family: var(--font-sans); height: 100vh; overflow: hidden; }
    .browser-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    .top-header { display: flex; align-items: center; height: 38px; background: var(--bg-header); border-bottom: 1px solid var(--border-subtle); padding-left: 10px; gap: 8px; }
    .header-logo { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; padding-right: 8px; }
    .sky-icon { color: var(--accent-sky); }
    .badge-rust { background: rgba(56, 189, 248, 0.15); color: var(--accent-sky); font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .tab-strip { display: flex; align-items: center; gap: 4px; flex: 1; overflow-x: auto; height: 100%; padding-top: 4px; }
    .tab-item { display: flex; align-items: center; gap: 8px; background: var(--bg-tab-inactive); border: 1px solid var(--border-subtle); border-bottom: none; padding: 0 12px; height: 34px; border-top-left-radius: 8px; border-top-right-radius: 8px; min-width: 130px; max-width: 200px; cursor: pointer; transition: all 0.15s ease; }
    .tab-item:hover { background: var(--bg-hover); }
    .tab-item.active { background: var(--bg-tab-active); border-color: var(--border-active); border-bottom: 2px solid var(--accent-sky); }
    .tab-title { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .tab-close { color: var(--text-muted); width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all 0.15s ease; }
    .tab-close:hover { background: var(--accent-rose); color: white; }
    .new-tab-btn { background: transparent; border: none; color: var(--text-muted); width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s ease; margin-right: 10px; }
    .new-tab-btn:hover { background: var(--bg-hover); color: var(--accent-sky); }
    .toolbar { display: flex; align-items: center; gap: 8px; height: 42px; background: var(--bg-toolbar); border-bottom: 1px solid var(--border-subtle); padding: 0 10px; }
    .nav-controls { display: flex; align-items: center; gap: 3px; }
    .tool-btn { background: transparent; border: none; color: var(--text-muted); width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s ease; }
    .tool-btn:hover:not([disabled]) { background: var(--bg-hover); color: var(--text-main); transform: translateY(-1px); }
    .tool-btn[disabled] { opacity: 0.3; cursor: default; }
    .omnibox-container { flex: 1; display: flex; align-items: center; background: var(--bg-omnibox); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 0 10px; height: 32px; transition: all 0.2s ease; }
    .omnibox-container:focus-within { border-color: var(--accent-sky); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
    .ssl-indicator { color: var(--accent-emerald); display: flex; align-items: center; margin-right: 8px; }
    #address-bar { flex: 1; background: transparent; border: none; outline: none; color: var(--text-main); font-family: var(--font-sans); font-size: 13px; }
    .viewport-container { flex: 1; width: 100%; height: calc(100% - 104px); position: relative; background: #ffffff; }
    .tab-frame { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; display: none; }
    .tab-frame.active { display: block; }
    .statusbar { height: 22px; background: var(--bg-header); border-top: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 10px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="browser-container">
    <header class="top-header">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" width="16" height="16" class="sky-icon">
          <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        <span class="logo-title">Sky</span>
        <span class="badge-rust">Rust</span>
      </div>

      <div class="tab-strip" id="tab-strip"></div>

      <button id="btn-new-tab" class="new-tab-btn" title="New Tab">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
    </header>

    <nav class="toolbar">
      <div class="nav-controls">
        <button id="btn-back" class="tool-btn" title="Back">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <button id="btn-forward" class="tool-btn" title="Forward">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/></svg>
        </button>
        <button id="btn-reload" class="tool-btn" title="Reload Page">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button id="btn-home" class="tool-btn" title="Home Page">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>
      </div>

      <div class="omnibox-container">
        <div id="ssl-badge" class="ssl-indicator" title="Connection is secure">
          <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
        <input type="text" id="address-bar" placeholder="Search or type a Web URL (e.g., github.com)" value="https://www.google.com">
      </div>
    </nav>

    <main id="viewport-container" class="viewport-container"></main>

    <footer class="statusbar">
      <span id="status-message">Sky Rust Active</span>
      <span id="page-title">Google</span>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let tabs = [];
      let activeTabId = null;

      const tabStrip = document.getElementById('tab-strip');
      const btnNewTab = document.getElementById('btn-new-tab');
      const viewportContainer = document.getElementById('viewport-container');
      const addressBar = document.getElementById('address-bar');
      const btnBack = document.getElementById('btn-back');
      const btnForward = document.getElementById('btn-forward');
      const btnReload = document.getElementById('btn-reload');
      const btnHome = document.getElementById('btn-home');
      const statusMessage = document.getElementById('status-message');
      const pageTitle = document.getElementById('page-title');

      function formatUrlOrQuery(input) {
        const query = input.trim();
        if (!query) return 'https://www.google.com';
        if (/^https?:\/\//i.test(query)) return query;
        const domainRegex = /^([a-z0-9\-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i;
        if (domainRegex.test(query) || /^localhost(:\d+)?(\/.*)?$/i.test(query)) {
          return 'https://' + query;
        }
        return 'https://www.google.com/search?q=' + encodeURIComponent(query);
      }

      function createTab(url = 'https://www.google.com') {
        const tabId = 'tab-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
        const initialUrl = formatUrlOrQuery(url);

        const iframe = document.createElement('iframe');
        iframe.id = 'frame-' + tabId;
        iframe.className = 'tab-frame';
        iframe.src = initialUrl;
        iframe.setAttribute('allow', 'fullscreen; camera; microphone');
        viewportContainer.appendChild(iframe);

        const tab = { id: tabId, title: 'Google', url: initialUrl, iframe: iframe };
        tabs.push(tab);

        iframe.addEventListener('load', () => {
          try {
            const frameUrl = iframe.contentWindow.location.href;
            if (frameUrl && frameUrl !== 'about:blank') {
              tab.url = frameUrl;
              const frameTitle = iframe.contentDocument ? iframe.contentDocument.title : 'Google';
              tab.title = frameTitle || 'Web Page';
            }
          } catch (e) {
            tab.title = tab.url.replace(/^https?:\/\//, '').split('/')[0] || 'Google';
          }
          renderTabs();
          if (activeTabId === tabId) syncTabUI(tab);
        });

        switchTab(tabId);
      }

      function switchTab(tabId) {
        activeTabId = tabId;
        const tab = tabs.find(t => t.id === tabId);
        if (!tab) return;

        tabs.forEach(t => t.iframe.classList.remove('active'));
        tab.iframe.classList.add('active');
        syncTabUI(tab);
        renderTabs();
      }

      function syncTabUI(tab) {
        if (addressBar && document.activeElement !== addressBar) addressBar.value = tab.url;
        if (pageTitle) pageTitle.innerText = tab.title;
        if (statusMessage) statusMessage.innerText = 'Sky Rust Browser Active';
      }

      function closeTab(tabId, e) {
        if (e) e.stopPropagation();
        const index = tabs.findIndex(t => t.id === tabId);
        if (index === -1) return;

        tabs[index].iframe.remove();
        tabs.splice(index, 1);

        if (tabs.length === 0) {
          createTab('https://www.google.com');
        } else {
          switchTab(tabs[Math.max(0, index - 1)].id);
        }
      }

      function renderTabs() {
        tabStrip.innerHTML = '';
        tabs.forEach(tab => {
          const tabEl = document.createElement('div');
          tabEl.className = `tab-item ${tab.id === activeTabId ? 'active' : ''}`;
          tabEl.innerHTML = `
            <span class="tab-title">${tab.title || 'Tab'}</span>
            <span class="tab-close" data-id="${tab.id}">✕</span>
          `;
          tabEl.addEventListener('click', () => switchTab(tab.id));
          tabEl.querySelector('.tab-close').addEventListener('click', (e) => closeTab(tab.id, e));
          tabStrip.appendChild(tabEl);
        });
      }

      addressBar?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const targetUrl = formatUrlOrQuery(addressBar.value);
          const activeTab = tabs.find(t => t.id === activeTabId);
          if (activeTab) {
            activeTab.url = targetUrl;
            activeTab.iframe.src = targetUrl;
          }
          addressBar.blur();
        }
      });
      addressBar?.addEventListener('focus', () => addressBar.select());

      btnNewTab?.addEventListener('click', () => createTab());
      btnBack?.addEventListener('click', () => {
        const tab = tabs.find(t => t.id === activeTabId);
        if (tab) try { tab.iframe.contentWindow.history.back(); } catch (e) {}
      });
      btnForward?.addEventListener('click', () => {
        const tab = tabs.find(t => t.id === activeTabId);
        if (tab) try { tab.iframe.contentWindow.history.forward(); } catch (e) {}
      });
      btnReload?.addEventListener('click', () => {
        const tab = tabs.find(t => t.id === activeTabId);
        if (tab) tab.iframe.src = tab.url;
      });
      btnHome?.addEventListener('click', () => {
        const tab = tabs.find(t => t.id === activeTabId);
        if (tab) { tab.url = 'https://www.google.com'; tab.iframe.src = 'https://www.google.com'; }
      });

      createTab('https://www.google.com');
    });
  </script>
</body>
</html>
