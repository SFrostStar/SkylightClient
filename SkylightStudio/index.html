<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skylight Studio v1.0 - Luxury Edition</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Custom Glass Header -->
    <header class="titlebar">
      <div class="titlebar-drag-region">
        <div class="titlebar-logo">
          <span class="logo-icon">⚡</span>
          <span class="gradient-text">Skylight <span class="accent-gold">Studio</span></span>
          <span class="version-badge">v1.0 Pro</span>
        </div>
        <div class="titlebar-watermark">
          <span class="status-dot online"></span>
          <span>By SFrostStar | Luau Engine</span>
        </div>
      </div>
      <div class="window-controls">
        <button id="btn-minimize" class="control-btn" title="Minimize">⎯</button>
        <button id="btn-maximize" class="control-btn" title="Maximize">🗖</button>
        <button id="btn-close" class="control-btn close-btn" title="Close">✕</button>
      </div>
    </header>

    <!-- Main Body -->
    <div class="app-body">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="nav-section">
          <button id="nav-editor" class="nav-item active" title="Lua Code Editor">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
            <span>Editor</span>
          </button>
          <button id="nav-scripthub" class="nav-item" title="Community Script Hub">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            <span>Script Hub</span>
          </button>
          <button id="nav-console-toggle" class="nav-item" title="Console Logs">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H4v-4h11v4zm0-5H4V9h11v4zm5 5h-4V9h4v9z"/></svg>
            <span>Console</span>
          </button>
        </div>
        <div class="nav-bottom">
          <button id="btn-execute-sim" class="execute-btn" title="Validate & Run Script">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
            <span>RUN</span>
          </button>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main class="workspace">
        <!-- Editor View -->
        <section id="view-editor" class="view-panel active">
          <div class="editor-header">
            <div class="tab-bar" id="tab-bar">
              <!-- Tabs rendered dynamically -->
            </div>
            <div class="editor-actions">
              <button id="btn-new-tab" class="action-btn" title="New Tab">+ New</button>
              <button id="btn-open-file" class="action-btn" title="Open File">📂 Open</button>
              <button id="btn-save-file" class="action-btn accent-btn" title="Save File (Ctrl+S)">💾 Save</button>
            </div>
          </div>
          <div id="monaco-container" class="editor-container"></div>
        </section>

        <!-- Script Hub View -->
        <section id="view-scripthub" class="view-panel hidden">
          <div class="scripthub-header">
            <h2>⚡ Skylight Community Script Hub</h2>
            <p>Select high-performance Lua scripts, frameworks & utilities to load into your editor.</p>
            <div class="search-bar">
              <input type="text" id="script-search" placeholder="Search by script name, tag, or author...">
            </div>
          </div>
          <div class="script-grid" id="script-grid">
            <!-- Cards rendered via renderer.js -->
          </div>
        </section>
      </main>
    </div>

    <!-- Functional Output Console -->
    <footer id="console-drawer" class="console-drawer">
      <div class="console-header" id="console-header">
        <div class="console-title">
          <span class="console-badge">DIAGNOSTICS</span>
          <span>Output & Real-Time Log Terminal</span>
        </div>
        <div class="console-actions">
          <button id="btn-clear-console" class="icon-btn" title="Clear Logs">🗑️ Clear</button>
          <button id="btn-toggle-drawer" class="icon-btn" title="Toggle Size">▼ Toggle</button>
        </div>
      </div>
      <div class="console-body" id="console-logs">
        <!-- Log entries -->
      </div>
    </footer>

    <!-- Status Bar -->
    <div class="statusbar">
      <div class="status-item">
        <span class="indicator"></span>
        <span id="status-text">Status: Ready</span>
      </div>
      <div class="status-item right">
        <span id="syntax-status">Syntax: Valid</span>
        <span>Environment: Luau / Lua 5.1</span>
        <span>UTF-8</span>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
